name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建 / 单测 / 覆盖率门槛
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 锁文件不得残留镜像 tarball URL
        run: |
          # 本地淘宝镜像会把绝对 tarball URL 写进 pnpm-lock.yaml，触发 pnpm 的
          # 供应链校验失败（ERR_PNPM_TARBALL_URL_MISMATCH）。这里提前给出可操作的
          # 报错，修复方式见 CONTRIBUTING.md「更新锁文件必须用官方 registry」。
          if grep -q 'tarball: https://registry.npm' pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml 含镜像 tarball URL，请用官方 registry 重新生成：pnpm install --lockfile-only --registry=https://registry.npmjs.org/"
            exit 1
          fi

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建
        run: pnpm run build

      - name: 内核 + 单元测试
        run: |
          pnpm run test:kernel
          pnpm run test:unit

      - name: 覆盖率门槛（c8，见 .c8rc.json）
        run: pnpm run coverage

      - name: 评测 harness 自检（reference 实现，防止 harness 腐化）
        run: |
          node eval/run.mjs --reference
          node eval/compare/run.mjs --reference

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    name: 真实浏览器端到端（手动触发）
    # 需要真实 Chrome/Chromium。默认不随每次 push 运行，避免在没有浏览器的
    # runner 上产生假失败：在 Actions 页面手动 Run workflow 即可。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser

      - name: 构建示例应用
        run: pnpm run build:example

      - name: 端到端验证
        run: node test/browser.mjs
