<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plain —— 面向 AI 的迷你框架原型</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --fg: #e6e9ef;
        --muted: #8b93a7;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.6;
      }
      main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
      header { margin-bottom: 24px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .muted { color: var(--muted); font-size: 14px; margin: 4px 0; }
      .card {
        background: var(--card);
        border: 1px solid #262a36;
        border-radius: 12px;
        padding: 18px 20px;
        margin-bottom: 18px;
      }
      h2 { font-size: 17px; margin: 0 0 12px; }
      .big { font-size: 40px; font-weight: 700; margin: 4px 0 12px; }
      button {
        background: var(--accent);
        color: #0f1117;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
      }
      button:hover { filter: brightness(1.08); }
      input[type="text"], input:not([type]) {
        background: #0f1117;
        border: 1px solid #2c3140;
        color: var(--fg);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }
      .row { display: flex; gap: 8px; margin-bottom: 12px; }
      .row input { flex: 1; }
      .todos { list-style: none; padding: 0; margin: 0; }
      .todos li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #232733;
      }
      .todos li.done span { text-decoration: line-through; color: var(--muted); }
      .ok { color: #7ee787; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
